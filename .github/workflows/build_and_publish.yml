name: build-and-publish

on:
  workflow_dispatch:
    inputs:
      variant:
        description: >
          Package version variant (see version table in workflow comments)
        required: true
        type: choice
        options:
          - "1.13.1"
          - "1.13.2"
          - "1.13.3"
          - "1.13.4"
          - "1.13.5"
          - "1.13.6"
          - "1.13.7"
          - "1.13.8"
          - "1.13.9"
          - "1.13.10"
          - "1.13.11"
          - "1.13.12"
        default: "1.13.7"
      publish:
        description: Publish wheels to PyPI
        required: true
        type: boolean
        default: false

# ┌──────────┬─────────┬──────┬─────────────────┐
# │ Variant  │ PyTorch │ CUDA │ Python           │
# ├──────────┼─────────┼──────┼─────────────────┤
# │ 1.13.1   │ 2.0.1   │ 11.7 │ 3.9-3.11        │
# │ 1.13.2   │ 2.1.2   │ 12.1 │ 3.9-3.11        │
# │ 1.13.3   │ 2.2.2   │ 12.1 │ 3.9-3.12        │
# │ 1.13.4   │ 2.3.1   │ 12.1 │ 3.9-3.12        │
# │ 1.13.5   │ 2.4.1   │ 12.1 │ 3.9-3.12        │
# │ 1.13.6   │ 2.5.1   │ 12.4 │ 3.9-3.13        │
# │ 1.13.7   │ 2.6.0   │ 12.4 │ 3.9-3.13        │
# │ 1.13.8   │ 2.7.1   │ 12.6 │ 3.9-3.13        │
# │ 1.13.9   │ 2.8.0   │ 12.6 │ 3.9-3.13        │
# │ 1.13.10  │ 2.9.1   │ 12.8 │ 3.9-3.13        │
# │ 1.13.11  │ 2.10.0  │ 12.8 │ 3.9-3.13        │
# │ 1.13.12  │ 2.11.0  │ 13.0 │ 3.9-3.13        │
# └──────────┴─────────┴──────┴─────────────────┘
# Linux builds include CUDA; macOS and Windows are CPU-only.

concurrency:
  group: build-and-publish-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Resolve variant → torch version, CUDA version, python matrix
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      ft_version: ${{ steps.map.outputs.ft_version }}
      torch_version: ${{ steps.map.outputs.torch_version }}
      cuda_version: ${{ steps.map.outputs.cuda_version }}
      python_matrix: ${{ steps.map.outputs.python_matrix }}
      torch_pin: ${{ steps.map.outputs.torch_pin }}
      torch_suffix_linux: ${{ steps.map.outputs.torch_suffix_linux }}
      torch_suffix_cpu: ${{ steps.map.outputs.torch_suffix_cpu }}
    steps:
      - id: map
        shell: bash
        run: |
          variant="${{ inputs.variant }}"
          case "$variant" in
            1.13.1)  torch=2.0.1;  cuda=11.7; py='["3.9","3.10","3.11"]' ;;
            1.13.2)  torch=2.1.2;  cuda=12.1; py='["3.9","3.10","3.11"]' ;;
            1.13.3)  torch=2.2.2;  cuda=12.1; py='["3.9","3.10","3.11","3.12"]' ;;
            1.13.4)  torch=2.3.1;  cuda=12.1; py='["3.9","3.10","3.11","3.12"]' ;;
            1.13.5)  torch=2.4.1;  cuda=12.1; py='["3.9","3.10","3.11","3.12"]' ;;
            1.13.6)  torch=2.5.1;  cuda=12.4; py='["3.9","3.10","3.11","3.12","3.13"]' ;;
            1.13.7)  torch=2.6.0;  cuda=12.4; py='["3.9","3.10","3.11","3.12","3.13"]' ;;
            1.13.8)  torch=2.7.1;  cuda=12.6; py='["3.9","3.10","3.11","3.12","3.13"]' ;;
            1.13.9)  torch=2.8.0;  cuda=12.6; py='["3.9","3.10","3.11","3.12","3.13"]' ;;
            1.13.10) torch=2.9.1;  cuda=12.8; py='["3.9","3.10","3.11","3.12","3.13"]' ;;
            1.13.11) torch=2.10.0; cuda=12.8; py='["3.9","3.10","3.11","3.12","3.13"]' ;;
            1.13.12) torch=2.11.0; cuda=13.0; py='["3.9","3.10","3.11","3.12","3.13"]' ;;
            *) echo "Unknown variant: $variant"; exit 1 ;;
          esac
          echo "ft_version=$variant"       >> "$GITHUB_OUTPUT"
          echo "torch_version=$torch"      >> "$GITHUB_OUTPUT"
          echo "cuda_version=$cuda"        >> "$GITHUB_OUTPUT"
          echo "python_matrix=$py"         >> "$GITHUB_OUTPUT"
          echo "torch_pin=torch>=${torch%.*}.0,<=${torch}" >> "$GITHUB_OUTPUT"
          echo "torch_suffix_linux=+torch${torch}_cuda${cuda}" >> "$GITHUB_OUTPUT"
          echo "torch_suffix_cpu=+torch${torch}_cpu" >> "$GITHUB_OUTPUT"

          echo "### Variant $variant" >> "$GITHUB_STEP_SUMMARY"
          echo "- **fast_rnnt** $variant" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PyTorch** $torch" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CUDA** $cuda" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Linux — CUDA build
  # ---------------------------------------------------------------------------
  build-linux:
    name: linux-py${{ matrix.python-version }}
    needs: resolve
    runs-on: ubuntu-22.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.resolve.outputs.python_matrix) }}
    env:
      TORCH_VERSION: ${{ needs.resolve.outputs.torch_version }}
      CUDA_VER: ${{ needs.resolve.outputs.cuda_version }}
      FT_VERSION_OVERRIDE: ${{ needs.resolve.outputs.ft_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python path
        run: |
          py_nodot=$(echo "${{ matrix.python-version }}" | tr -d '.')
          echo "PYTHON_BIN=/opt/python/cp${py_nodot}-cp${py_nodot}/bin" >> "$GITHUB_ENV"

      - name: Install compatible GCC
        run: |
          dnf install -y gcc-toolset-13-gcc gcc-toolset-13-gcc-c++
          echo "CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc"       >> "$GITHUB_ENV"
          echo "CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++"      >> "$GITHUB_ENV"
          echo "CUDAHOSTCXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++" >> "$GITHUB_ENV"

      - name: Install CUDA toolkit
        shell: bash
        run: |
          echo "Installing CUDA ${CUDA_VER}"
          case "${CUDA_VER}" in
            11.7)
              url=https://developer.download.nvidia.com/compute/cuda/11.7.1/local_installers/cuda_11.7.1_515.65.01_linux.run
              ;;
            11.8)
              url=https://developer.download.nvidia.com/compute/cuda/11.8.0/local_installers/cuda_11.8.0_520.61.05_linux.run
              ;;
            12.1)
              url=https://developer.download.nvidia.com/compute/cuda/12.1.1/local_installers/cuda_12.1.1_530.30.02_linux.run
              ;;
            12.4)
              url=https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_550.54.15_linux.run
              ;;
            12.6)
              url=https://developer.download.nvidia.com/compute/cuda/12.6.3/local_installers/cuda_12.6.3_560.35.05_linux.run
              ;;
            12.8)
              # TODO: update URL when CUDA 12.8 runfile is available
              url=https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_570.86.15_linux.run
              ;;
            13.0)
              # TODO: update URL when CUDA 13.0 runfile is available
              url=https://developer.download.nvidia.com/compute/cuda/13.0.0/local_installers/cuda_13.0.0_linux.run
              ;;
            *)
              echo "Unsupported CUDA version: ${CUDA_VER}"
              exit 1
              ;;
          esac

          curl -LSs -O "${url}"
          filename=$(basename "${url}")
          chmod +x "./${filename}"
          "./${filename}" --toolkit --silent --no-opengl-libs --override
          rm -f "./${filename}"

          echo "CUDA_HOME=/usr/local/cuda" >> "$GITHUB_ENV"
          echo "/usr/local/cuda/bin"        >> "$GITHUB_PATH"

      - name: Install build tools
        run: |
          ${PYTHON_BIN}/python -m pip install --upgrade pip
          ${PYTHON_BIN}/python -m pip install build "setuptools>=61.0" wheel cmake ninja auditwheel

      - name: Install PyTorch
        shell: bash
        run: |
          cuda_tag=$(echo "${CUDA_VER}" | tr -d '.')
          index_url="https://download.pytorch.org/whl/cu${cuda_tag}"
          echo "Installing torch==${TORCH_VERSION} from ${index_url}"
          ${PYTHON_BIN}/python -m pip install "torch==${TORCH_VERSION}" --index-url "${index_url}"
          ${PYTHON_BIN}/python -c "import torch; print('torch:', torch.__version__, 'cuda:', torch.version.cuda)"

      - name: Build wheel
        env:
          FT_CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Release -DFT_BUILD_TESTS=OFF -DFT_WITH_CUDA=ON"
          FT_TORCH_REQUIREMENT: "${{ needs.resolve.outputs.torch_pin }}"
          FT_VERSION_SUFFIX: "${{ needs.resolve.outputs.torch_suffix_linux }}"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          export PATH="${PYTHON_BIN}:${PATH}"
          python -m build --wheel --no-isolation

      - name: Repair wheel (manylinux tag)
        run: |
          ${PYTHON_BIN}/python -m auditwheel repair dist/*.whl \
            --exclude libtorch.so \
            --exclude libtorch_cpu.so \
            --exclude libtorch_cuda.so \
            --exclude libtorch_python.so \
            --exclude libc10.so \
            --exclude libc10_cuda.so \
            --exclude libcudart.so \
            --exclude libnvToolsExt.so \
            --exclude libcudnn.so \
            --exclude libnvrtc.so \
            -w repaired/
          rm -rf dist/
          mv repaired/ dist/

      - name: Verify wheel
        run: |
          cuda_tag=$(echo "${CUDA_VER}" | tr -d '.')
          index_url="https://download.pytorch.org/whl/cu${cuda_tag}"
          ${PYTHON_BIN}/python -m pip install --force-reinstall dist/*.whl "torch==${TORCH_VERSION}" --index-url "${index_url}"
          ${PYTHON_BIN}/python -c "import fast_rnnt; print('version:', fast_rnnt.__version__); print('cuda:', fast_rnnt.with_cuda)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows — CPU-only build
  # ---------------------------------------------------------------------------
  build-windows:
    name: windows-py${{ matrix.python-version }}
    needs: resolve
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.resolve.outputs.python_matrix) }}
    env:
      TORCH_VERSION: ${{ needs.resolve.outputs.torch_version }}
      FT_VERSION_OVERRIDE: ${{ needs.resolve.outputs.ft_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "setuptools>=61.0" wheel cmake ninja

      - name: Install PyTorch
        shell: bash
        run: |
          echo "Installing torch==${TORCH_VERSION} (CPU)"
          python -m pip install "torch==${TORCH_VERSION}" --index-url "https://download.pytorch.org/whl/cpu"
          python -c "import torch; print('torch:', torch.__version__)"

      - name: Build wheel
        shell: bash
        env:
          FT_CMAKE_ARGS: "-GNinja -DCMAKE_BUILD_TYPE=Release -DFT_BUILD_TESTS=OFF -DFT_WITH_CUDA=OFF"
          FT_TORCH_REQUIREMENT: "${{ needs.resolve.outputs.torch_pin }}"
          FT_VERSION_SUFFIX: "${{ needs.resolve.outputs.torch_suffix_cpu }}"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          python -m build --wheel --no-isolation

      - name: Verify wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import fast_rnnt; print('version:', fast_rnnt.__version__); print('cuda:', fast_rnnt.with_cuda)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS — CPU-only build
  # ---------------------------------------------------------------------------
  build-macos:
    name: macos-py${{ matrix.python-version }}
    needs: resolve
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.resolve.outputs.python_matrix) }}
    env:
      TORCH_VERSION: ${{ needs.resolve.outputs.torch_version }}
      FT_VERSION_OVERRIDE: ${{ needs.resolve.outputs.ft_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "setuptools>=61.0" wheel cmake ninja

      - name: Install PyTorch
        run: |
          python -m pip install "torch==${TORCH_VERSION}" --index-url "https://download.pytorch.org/whl/cpu"
          python -c "import torch; print('torch:', torch.__version__)"

      - name: Build wheel
        env:
          FT_CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Release -DFT_BUILD_TESTS=OFF -DFT_WITH_CUDA=OFF"
          FT_TORCH_REQUIREMENT: "${{ needs.resolve.outputs.torch_pin }}"
          FT_VERSION_SUFFIX: "${{ needs.resolve.outputs.torch_suffix_cpu }}"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          python -m build --wheel --no-isolation

      - name: Verify wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import fast_rnnt; print('version:', fast_rnnt.__version__); print('cuda:', fast_rnnt.with_cuda)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish to PyPI
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish == 'true'
    permissions:
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload dist/*.whl
